      <style>
        :root { 
            --bg-main: #fdfafb; 
            --bg-surface: #ffffff; 
            --theme-dark: #722F37; 
            --header-bg: linear-gradient(135deg, #800020 0%, #4a0012 100%); 
            --text-light: #ffffff; 
            --text-dark: #2d3436; 
            --text-muted: #636e72; 
            --border-light: #eadddf; 
            --accent: #a31738; 
            --silver: #b2bec3; 
            --radius: 20px; 
            --shadow: 0 8px 20px rgba(128, 0, 32, 0.08); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center;}

        #global-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 5px solid var(--border-light); border-top: 5px solid var(--accent); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* إشعار تصغير وزجاجي شيك */
        .toast-notification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--header-bg); color: white; padding: 7px 16px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; box-shadow: 0 6px 20px rgba(114, 47, 55, 0.3); display: flex; align-items: center; gap: 6px; z-index: 99999; transition: all 0.35s ease; border: 1px solid rgba(255,255,255,0.2); }
        .toast-notification.show { top: 12px; }

        header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: var(--header-bg); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;}

        .header-right { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--text-light); object-fit: cover; }
        .site-name { font-size: 1.05rem; font-weight: bold; color: var(--text-light); } 
        .header-left { display: flex; gap: 15px; align-items: center; }
        .cart-icon { font-size: 1.3rem; color: var(--text-light); cursor: pointer; position: relative; transition: 0.3s; margin-left: 5px;}
        .cart-icon:hover { color: #f4d03f; }
        .cart-count { position: absolute; top: -6px; right: -8px; background: #e74c3c; color: white; border-radius: 50%; font-size: 0.7rem; padding: 2px 6px; font-weight: bold;}

        main { padding: 20px 15px; width: 100%; max-width: 800px; flex: 1; animation: fadeInPage 0.25s ease-out; }
        @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .back-arrow { display: inline-flex; align-items: center; gap: 8px; color: var(--theme-dark); font-weight: bold; cursor: pointer; padding: 8px 15px; background: var(--bg-surface); border-radius: 25px; box-shadow: var(--shadow); font-size: 0.85rem; transition: 0.3s;}
        .top-title-text { font-size: 0.85rem; font-weight: bold; color: var(--text-muted); background: var(--bg-surface); padding: 8px 15px; border-radius: 25px; box-shadow: var(--shadow); border: 1px solid var(--border-light);}

        .categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
        .category-card { background-color: var(--bg-surface); border-radius: var(--radius); overflow: hidden; text-align: center; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border-light); }
        .category-card img { width: 100%; height: 130px; object-fit: cover; object-position: top center; display: block;}
        .category-card h3 { background: var(--header-bg); color: var(--text-light); padding: 10px; font-size: 0.95rem; margin: 0; }

        .inner-product-card { position: relative; background: var(--bg-surface); border-radius: var(--radius); overflow: hidden; text-align: center; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border-light); flex-shrink: 0; scroll-snap-align: start; }
        .inner-product-card .img-container { position: relative; width: 100%; height: 130px; }
        .inner-product-card img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; border-bottom: 1px solid var(--border-light);}
        .title-price-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 0; gap: 4px; }
        .inner-product-card h3 { padding: 0; font-size: 0.82rem; color: var(--text-dark); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
        .product-price-badge { font-size: 0.85rem; font-weight: bold; color: var(--accent); margin: 0; white-space: nowrap; }

        /* سطر الألوان والوصف المصغر على كارت المنتج */

        .card-desc-line { padding: 0 8px 6px; font-size: 0.7rem; color: var(--text-muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

        .badge-discount { position: absolute; top: 8px; left: 8px; background-color: #e74c3c; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; z-index: 5;}
        .badge-outofstock { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(114, 47, 55, 0.85); color: white; padding: 6px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; z-index: 5; white-space: nowrap; }
        .img-outofstock { opacity: 0.4; filter: grayscale(30%); }

        .slider-section { background-color: var(--bg-surface); padding: 18px 15px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 25px;}
        .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--border-light); padding-bottom: 8px;}

        .slider-nav { display: flex; gap: 8px; }
        .slider-arrow { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-main); color: var(--theme-dark); display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 0.7rem; border: 1px solid var(--border-light);}
        .slider-container { display: flex; overflow-x: auto; scroll-behavior: smooth; gap: 12px; padding-bottom: 5px; scroll-snap-type: x mandatory;}

        .share-icon { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.95); color: var(--theme-dark); width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; font-size: 0.8rem;}

        .details-image-wrapper { width: 100%; max-width: 300px; margin: 0 auto 10px auto; overflow: hidden; position: relative;}

        .dot.active { background: var(--theme-dark); transform: scale(1.2); }

        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; padding: 20px;}
        .lightbox img { width: 100%; max-width: 400px; max-height: 80vh; border-radius: 15px; object-fit: contain; }
        .close-lightbox { color: white; font-size: 2rem; margin-bottom: 20px; cursor: pointer; }

        .info-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); padding: 12px 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-light); font-size: 0.95rem;}

        /* قسم تجهيز الطلب والسماح بظهور القوائم فوق الكروت */
        .options-section { background: var(--bg-surface); padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-light); overflow: visible !important; position: relative; z-index: 10;}

        .btn { width: 100%; padding: 12px; border: none; border-radius: 15px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; color: white; transition: 0.3s; margin-top: 15px;}
        .btn-primary { background: var(--theme-dark); }
        .btn-cart { background: var(--bg-surface); color: var(--theme-dark); border: 2px solid var(--theme-dark); }
        .btn-whatsapp { background: #25D366; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: var(--text-dark); font-size: 0.9rem;}
        .form-control { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-light); font-size: 0.95rem; background: var(--bg-main); outline: none;}

        .order-options-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 15px; }
        .order-options-row .custom-select-wrapper,
        .order-options-row .form-group { flex: 1; margin-bottom: 0; min-width: 0; }
        .order-options-row label { font-size: 0.78rem; white-space: nowrap; margin-bottom: 5px; }
        .order-options-row .custom-select-btn,
        .order-options-row .form-control { padding: 8px 6px; font-size: 0.85rem; height: 40px; box-sizing: border-box; }

        .cart-total-box { background: var(--theme-dark); color: white; padding: 10px; border-radius: 12px; text-align: center; font-size: 0.95rem; font-weight: bold; margin-top: 15px; box-shadow: var(--shadow);}

        /* ضبط القوائم المنسدلة لتظهر بأعلى طبقة دون الاختفاء */
        .custom-select-wrapper { position: relative; margin-bottom: 0; z-index: 30; }
        .custom-select-wrapper label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-dark); font-size: 0.9rem; }
        .custom-select-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 15px; background: var(--bg-main); border: 1px solid var(--border-light); border-radius: 12px; font-size: 0.85rem; color: var(--text-dark); cursor: pointer; transition: 0.3s; }
        .custom-select-btn:hover { border-color: var(--accent); }
        .custom-select-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: 12px; margin-top: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.18); z-index: 999; max-height: 180px; overflow-y: auto; display: none; flex-direction: column; padding: 5px; }
        .custom-select-list.show { display: flex; animation: fadeInDown 0.2s ease-out; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-select-item { padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; color: var(--text-dark); }
        .custom-select-item:hover { background: var(--bg-main); color: var(--accent); font-weight: bold; }

        /* شرائح العرض المصغرة للألوان والمقاسات */
        .info-chips-wrapper { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; align-items: center; }

        .info-color-dot-only { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; cursor: pointer; transition: 0.2s; }
        .info-color-dot-only:hover { transform: scale(1.2); }
    </style>
</head>

            if(!s) return '';
            return s.replace('Free Size', 'Free')

        window.optimizeImage = function(url, width = 400) {
    if (!url) return '';
    let cleanUrl = url;
    let cropTransform = '';

    if (url.includes('#crop=')) {
        const parts = url.split('#crop=');
        cleanUrl = parts[0];
        // تم إضافة g_north_west لبدء القص من أعلى اليسار بدقة بدلاً من المنتصف
        cropTransform = 'c_crop,g_north_west,' + parts[1] + '/';
    }

    if (cleanUrl.includes('res.cloudinary.com') && cleanUrl.includes('/upload/')) {
        return cleanUrl.replace('/upload/', `/upload/${cropTransform}c_scale,w_${width},q_auto,f_auto/`);
    }
    return cleanUrl;
}

    return url.split('#crop=')[0];
}

        async function fetchProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));

                window.products = querySnapshot.docs.map(doc => ({
                    id: doc.id,
                    firebaseId: doc.id,
                    ...doc.data()
                }));

                document.getElementById('global-loader').style.display = 'none';

                if (querySnapshot.empty) {
                    console.log("لا توجد منتجات حاليًا");
                    window.resetAndNavigate('home');
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const sharedCode = urlParams.get('p');

                window.history.replaceState({ page: 'home' }, "");

                if (sharedCode) {
                    const targetProduct = window.products.find(
                        x => String(x.shortCode) === String(sharedCode)
                    );

                    if (targetProduct) {
                        window.historyStack = ['home', 'details'];
                        window.history.pushState({ page: 'details' }, "");
                        window.openProduct(targetProduct.id, false);
                        return;
                    }
                }

                window.resetAndNavigate('home');

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('global-loader').style.display = 'none';
                window.resetAndNavigate('home');
            }
        }

        window.showToast = function(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2200);
        }

        window.resetAndNavigate = function(pageId) {
            window.historyStack = [pageId];
            window.history.replaceState({ page: pageId }, "");
            window.navigateUI(pageId);
        }

        window.navigate = function(pageId, pushToHistory = true) {
            if(pushToHistory && window.historyStack[window.historyStack.length - 1] !== pageId) {
                window.historyStack.push(pageId);
                window.history.pushState({ page: pageId }, "");
            }
            window.navigateUI(pageId);
        }

        window.navigateUI = function(pageId) {
            const pages = ['home', 'category', 'details', 'cart'];
            pages.forEach(p => document.getElementById(p).classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'instant' });

            const footer = document.getElementById('main-footer');
            if(pageId === 'home' || pageId === 'cart') {
                footer.style.display = 'block';
                footer.classList.remove('hidden');
            } else {
                footer.style.display = 'none';
            }

            if(pageId === 'home') window.renderHomeSlider();
            if(pageId === 'cart') window.renderCart();
        }

        window.addEventListener('popstate', (e) => {
            if (window.historyStack.length > 1) {
                window.historyStack.pop(); 
                let previousPage = window.historyStack[window.historyStack.length - 1]; 
                window.navigateUI(previousPage);
            } else {
                window.navigateUI('home');
            }
        });

        window.goBack = function() {
            if (window.historyStack.length > 1) {
                window.history.back();
            } else {
                window.resetAndNavigate('home');
            }
        }

        window.shareProduct = function(event, id) {
            event.stopPropagation();
            const p = window.products.find(x => String(x.id) === String(id));
            if(!p) return;

            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const cleanBaseUrl = baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl;
            const shareUrl = `${cleanBaseUrl}/p/${p.shortCode}`;            const shareText = `شاهد هذا المنتج من Esca Store:\n`;

            if (navigator.share) {
                navigator.share({ 
                    title: p.name, 
                    text: shareText, 
                    url: shareUrl 
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText + shareUrl).then(() => {
                    window.showToast("تم نسخ رابط المنتج بنجاح! 🔗"); 
                });
            }
        }

        window.updateCartBadge = function() { document.getElementById('cart-count-badge').innerText = window.cart.length; }

        window.generateProductCardHTML = function(p) {
            let displayImg = window.optimizeImage(p.images ? p.images[0] : p.img, 400);
            let discountBadge = (p.isOffer && p.discount) ? `<div class="badge-discount">خصم ${p.discount}</div>` : '';
            let outOfStockBadge = (p.qty <= 0) ? `<div class="badge-outofstock">انتهت الكمية</div>` : '';
            let imgClass = (p.qty <= 0) ? 'img-outofstock' : '';

            // 1. دوائر الألوان
            let cardColorDots = (p.colors || []).slice(0, 7).map(c => {
                let bgStyle = window.colorMap[c] || '#cccccc';
                let isGradient = bgStyle.includes('gradient');
                return `<span class="card-color-dot" title="${c}" style="${isGradient ? 'background:'+bgStyle : 'background-color:'+bgStyle}"></span>`;
            }).join('');

            let cardColorsRow = (p.colors && p.colors.length > 0) ? `
                <div class="card-colors-row">
                    <span class="card-colors-label">الألوان:</span>
                    <div class="card-colors-dots">${cardColorDots}</div>
                </div>
            ` : '';

            // 2. الوصف المختصر في سطر واحد
            let shortDesc = p.description ? `<p class="card-desc-line" title="${p.description}">${p.description}</p>` : '';

            return `
                <div class="inner-product-card" onclick="openProduct('${p.id}')">
                    ${discountBadge}
                    <div class="share-icon" onclick="shareProduct(event, '${p.id}')" title="مشاركة المنتج"><i class="fa-solid fa-share-nodes"></i></div>
                    <div class="img-container"><img src="${displayImg}" class="${imgClass}" loading="lazy">${outOfStockBadge}</div>
                    <div class="title-price-row">
                        <h3>${p.name}</h3>
                        <div class="product-price-badge">${p.price} ج.م</div>
                    </div>
                    ${cardColorsRow}
                    ${shortDesc}
                </div>
            `;
        }

        window.renderHomeSlider = function() {
            const slider = document.getElementById('latest-products-slider');
            let visibleProducts = window.products.filter(p => !p.hidden);

            if(visibleProducts.length === 0) {
                slider.innerHTML = '<p style="font-size:0.85rem; color:var(--text-muted)">لا توجد منتجات حالياً.</p>';
                return;
            }

            visibleProducts.sort((a, b) => {
                let dateA = a.createdAt ? (a.createdAt.seconds || new Date(a.createdAt).getTime()) : 0;
                let dateB = b.createdAt ? (b.createdAt.seconds || new Date(b.createdAt).getTime()) : 0;
                return dateB - dateA;
            });

            slider.innerHTML = visibleProducts.slice(0, 10).map(p => window.generateProductCardHTML(p)).join('');
            setTimeout(() => { slider.scrollLeft = 0; }, 10);
        }

        window.scrollSlider = function(direction) {
            const slider = document.getElementById('latest-products-slider');
            const scrollAmount = slider.clientWidth / 2;
            if(direction === 'right') { slider.scrollBy({ left: scrollAmount, behavior: 'smooth' }); } 
            else { slider.scrollBy({ left: -scrollAmount, behavior: 'smooth' }); }
        }

        window.openCategory = function(catName) {
            document.getElementById('category-title').innerText = catName === 'عروض' ? 'عروض خاصة' : "قسم " + catName;
            const container = document.getElementById('category-products');

            container.innerHTML = '';

            let filtered = catName === 'عروض' ? window.products.filter(p => p.isOffer === true && !p.hidden) : window.products.filter(p => p.category === catName && !p.hidden);

            if(filtered.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2; text-align:center; font-size:0.9rem; color:var(--text-muted)">لا توجد منتجات في هذا القسم حالياً.</p>';
            } else {
                container.innerHTML = filtered.map(p => window.generateProductCardHTML(p)).join('');
            }
            window.navigate('category');
        }

        window.updateSliderDots = function(sliderElement) {
            const absScroll = Math.abs(sliderElement.scrollLeft);
            const index = Math.round(absScroll / sliderElement.clientWidth);
            const dots = sliderElement.parentElement.parentElement.querySelectorAll('.dot');
            dots.forEach((dot, i) => { dot.classList.toggle('active', i === index); });
        }

        window.openLightbox = function(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }

        window.closeLightbox = function() { document.getElementById('lightbox').style.display = 'none'; }

        window.toggleDropdown = function(id) {
            document.querySelectorAll('.custom-select-list').forEach(el => {
                if(el.id !== id) el.classList.remove('show');
            });
            document.getElementById(id).classList.toggle('show');
        }

        window.selectCustomOption = function(type, realValue, displayValue) {
            document.getElementById(`order-${type}`).value = realValue;
            document.getElementById(`${type}-display`).innerText = displayValue || realValue;
            document.getElementById(`${type}-dropdown`).classList.remove('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.custom-select-wrapper')) {
                document.querySelectorAll('.custom-select-list').forEach(el => el.classList.remove('show'));
            }
        });

        window.openProduct = function(id, pushToHistory = true) {
            const p = window.products.find(x => String(x.id) === String(id));

            if (!p) {
                window.resetAndNavigate('home');
                return;
            }

            let pubDate = "أضيف حديثاً";
            if (p.createdAt) {
                try {
                    let d = p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
                    pubDate = d.toLocaleDateString('ar-EG') + ' - ' + d.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
                } catch(e) {}
            }

            let imgsArray = p.images && p.images.length > 0 ? p.images.slice(0, 7) : [p.img];
            let sliderHtml = imgsArray.map(imgSrc => `<img src="${window.optimizeImage(imgSrc, 500)}" onclick="openLightbox('${window.getFullImage(imgSrc)}')">`).join('');
            let dotsHtml = imgsArray.map((_, i) => `<span class="dot ${i===0 ? 'active' : ''}"></span>`).join('');

            let safeSizes = p.sizes || [];
            let safeColors = p.colors || [];

            // خيارات المقاسات مصغرة داخل المنسدلة
            let sizeItems = safeSizes.map(s => {
                let simpleS = window.simplifySize(s);
                return `<div class="custom-select-item" onclick="selectCustomOption('size', '${s}', '${simpleS}')">${simpleS}</div>`;
            }).join('');

            let colorItems = safeColors.map(c => `<div class="custom-select-item" onclick="selectCustomOption('color', '${c}', '${c}')">${c}</div>`).join('');

            let defaultSize = safeSizes.length > 0 ? safeSizes[0] : '';
            let defaultSizeSimple = window.simplifySize(defaultSize);
            let defaultColor = safeColors.length > 0 ? safeColors[0] : '';

            // شرائح المقاسات والألوان المتاحة لعرض المواصفات
            let availableSizesHtml = safeSizes.map(s => `<span class="info-size-badge">${window.simplifySize(s)}</span>`).join('');
            let availableColorsHtml = safeColors.map(c => {
                let bgStyle = window.colorMap[c] || '#cccccc';
                let isGradient = bgStyle.includes('gradient');
                return `<span class="info-color-dot-only" title="${c}" style="${isGradient ? 'background:'+bgStyle : 'background-color:'+bgStyle}"></span>`;
            }).join('');

            let orderSectionHTML = '';
            if (p.qty > 0) {
                orderSectionHTML = `
                <div class="options-section">
                    <div style="font-weight:bold; font-size:0.95rem; color:var(--theme-dark); margin-bottom: 12px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px;">تجهيز الطلب:</div>
                    
                    <input type="hidden" id="order-size" value="${defaultSize}">
                    <input type="hidden" id="order-color" value="${defaultColor}">

                    <div class="order-options-row">
                        <div class="custom-select-wrapper">
                            <label>المقاس:</label>
                            <div class="custom-select-btn" onclick="toggleDropdown('size-dropdown')">
                                <span id="size-display">${defaultSizeSimple || 'لا يوجد'}</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <div class="custom-select-list" id="size-dropdown">${sizeItems}</div>
                        </div>

                        <div class="custom-select-wrapper">
                            <label>اللون:</label>
                            <div class="custom-select-btn" onclick="toggleDropdown('color-dropdown')">
                                <span id="color-display">${defaultColor || 'لا يوجد'}</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <div class="custom-select-list" id="color-dropdown">${colorItems}</div>
                        </div>

                        <div class="form-group">
                            <label>الكمية:</label>
                            <input type="number" id="order-qty" class="form-control" value="1" min="1" max="${p.qty}" oninput="updateOrderTotal(${p.price}, this.value)">
                        </div>
                    </div>
                    
                    <div id="order-total-display" style="text-align:center; font-size:1.1rem; font-weight:bold; color:var(--theme-dark); margin-top:15px; margin-bottom:15px;">
                        الإجمالي: ${p.price} ج.م
                    </div>

                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button class="btn btn-whatsapp" style="flex: 1; margin-top: 0;" onclick="confirmDirectOrder('${p.id}')">
                            <i class="fa-brands fa-whatsapp"></i> اطلب الآن
                        </button>
                        <button class="btn btn-cart" style="width: 60px; height: 48px; margin-top: 0; padding: 0; display: flex; justify-content: center; align-items: center; font-size: 1.3rem;" onclick="addFromFormToCart('${p.id}')" title="إضافة للسلة">
                            <i class="fa-solid fa-cart-plus"></i>
                        </button>
                    </div>
                </div>`;
            } else {
                orderSectionHTML = `<button class="btn" style="background:#bdc3c7; color:#fff; cursor:not-allowed; margin-top: 15px;"><i class="fa-solid fa-ban"></i> انتهت الكمية</button>`;
            }

            document.getElementById('product-details-content').innerHTML = `
                <div class="details-image-wrapper"><div class="details-slider" onscroll="updateSliderDots(this)">${sliderHtml}</div></div>
                ${imgsArray.length > 1 ? `<div class="slider-dots">${dotsHtml}</div>` : ''}

                <div class="info-bar" style="align-items: flex-start;">
                    <div>
                        <strong style="font-size:0.95rem; display:block; margin-bottom:5px;">${p.name}</strong> 
                        <span style="color:var(--accent); font-weight:bold; font-size:1.1rem;">${p.price} ج.م</span>
                    </div>
                    <div style="text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                        <span style="font-size: 0.55rem; color: var(--silver); direction: ltr;">${pubDate}</span>
                        <span style="color:${p.qty > 0 ? 'var(--theme-dark)' : '#e74c3c'}; font-weight:bold; font-size:0.8rem; background: var(--bg-main); padding: 3px 8px; border-radius: 10px;">متاح: ${p.qty}</span>
                    </div>
                </div>

                <!-- تفاصيل الوصف -->
                <div class="options-section">
                    <div style="font-weight:bold; font-size:0.9rem; color:var(--text-dark); margin-bottom: 8px;"><i class="fa-solid fa-file-lines" style="color:var(--accent);"></i> تفاصيل المنتج:</div>
                    <p style="font-size:0.85rem; color:var(--text-muted); line-height: 1.6; margin: 0;">${p.description}</p>
                </div>

                <!-- المقاسات والألوان المتاحة بالشكل الجديد المصغر -->
                ${(safeSizes.length > 0 || safeColors.length > 0) ? `
                <div class="options-section">
                    ${safeSizes.length > 0 ? `
                    <div style="margin-bottom:8px;">
                        <div style="font-size:0.8rem; font-weight:bold; color:var(--text-dark); margin-bottom:4px;"><i class="fa-solid fa-ruler-horizontal" style="color:var(--accent);"></i> المقاسات المتاحة:</div>
                        <div class="info-chips-wrapper">${availableSizesHtml}</div>
                    </div>` : ''}

                    ${safeColors.length > 0 ? `
                    <div>
                        <div style="font-size:0.8rem; font-weight:bold; color:var(--text-dark); margin-bottom:4px;"><i class="fa-solid fa-palette" style="color:var(--accent);"></i> الألوان المتاحة:</div>
                        <div class="info-chips-wrapper">${availableColorsHtml}</div>
                    </div>` : ''}
                </div>` : ''}

                <!-- كود المنتج والتوصيل -->
                <div class="options-section" style="font-size:0.85rem; color:var(--text-dark)">
                    <div style="margin-bottom: 10px;"><i class="fa-solid fa-hashtag" style="color:var(--accent); width: 15px;"></i> <strong>كود المنتج:</strong> <span style="color:var(--theme-dark); font-weight:bold;">${p.shortCode}</span></div>
                    <div><i class="fa-solid fa-location-dot" style="color:var(--accent); width: 15px;"></i> <strong>التوصيل:</strong> ${p.delivery || 'غير محدد'}</div>
                </div>

                ${orderSectionHTML}
            `;
            window.navigate('details', pushToHistory);
        }

        window.updateOrderTotal = function(price, qty) {
            let total = price * (parseInt(qty) || 1);
            document.getElementById('order-total-display').innerText = `الإجمالي: ${total} ج.م`;
        }

        window.addFromFormToCart = function(id) {
            const p = window.products.find(x => String(x.id) === String(id));
            let size = document.getElementById('order-size').value, color = document.getElementById('order-color').value, qty = parseInt(document.getElementById('order-qty').value);
            if (isNaN(qty) || qty < 1 || qty > p.qty) { alert("كمية غير متاحة!"); return; }
            window.cart.push({ ...p, selSize: size, selColor: color, selQty: qty });
            localStorage.setItem('am_cart', JSON.stringify(window.cart));
            window.updateCartBadge(); 
            window.showToast("تمت الإضافة للسلة بنجاح! 🛒"); 
        }

        window.confirmDirectOrder = function(id) {
            const p = window.products.find(x => String(x.id) === String(id));
            let size = document.getElementById('order-size').value, color = document.getElementById('order-color').value, qty = parseInt(document.getElementById('order-qty').value);
            if (isNaN(qty) || qty < 1 || qty > p.qty) { alert("كمية غير متاحة!"); return; }

            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const cleanBaseUrl = baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl;
            const productUrl = `${cleanBaseUrl}/p/${p.shortCode}`;            const totalPrice = p.price * qty;

            let msg = `مرحباً Esca Store، أود طلب:\n\n🔖 كود المنتج: ${p.shortCode}\n المنتج: ${p.name}\n القسم: ${p.category}\n اللون: ${color}\n المقاس: ${size}\n العدد: ${qty}\n إجمالي الحساب: ${totalPrice} ج.م\n\n🔗 الرابط: ${productUrl}`;
            window.open(`https://wa.me/${window.SELLER_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.renderCart = function() {
            const c = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total-container');

            if(window.cart.length === 0) {
                c.innerHTML = '<p style="text-align:center; font-size:0.85rem; color:var(--text-muted)">السلة فارغة.</p>';
                totalContainer.innerHTML = '';
                return;
            }

            let totalCartPrice = 0;
            c.innerHTML = window.cart.map((item, i) => {
                let itemTotal = item.price * item.selQty;
                totalCartPrice += itemTotal;
                return `
                <div class="info-bar" style="margin-bottom:12px; padding: 10px;">
                    <img src="${window.optimizeImage(item.images ? item.images[0] : item.img, 100)}" style="width:50px; height:50px; border-radius:10px; object-fit:cover; border: 1px solid var(--border-light);">
                    <div style="flex:1; margin: 0 12px;">
                        <strong style="font-size:0.9rem;">${item.name}</strong><br>
                        <small style="color:var(--text-muted); font-size:0.75rem;">لون: ${item.selColor} | مقاس: ${item.selSize} | <strong style="color:var(--theme-dark)">العدد: ${item.selQty}</strong></small><br>
                        <span style="color:var(--accent); font-weight:bold; font-size:0.85rem;">${itemTotal} ج.م</span>
                    </div>
                    <i class="fa-solid fa-trash" style="color:#e74c3c; cursor:pointer; font-size:1.1rem; padding:8px;" onclick="removeFromCart(${i})"></i>
                </div>`;
            }).join('');

            totalContainer.innerHTML = `<div class="cart-total-box">إجمالي حساب السلة: ${totalCartPrice} ج.م</div>`;
        }

        window.removeFromCart = function(i) { 
            window.cart.splice(i, 1); 
            localStorage.setItem('am_cart', JSON.stringify(window.cart)); 
            window.updateCartBadge(); 
            window.renderCart(); 
            window.showToast("تم إزالة المنتج من السلة 🗑️"); 
        }

        window.checkoutCart = function() {
            if(!window.cart.length) return;
            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            let totalCartPrice = 0;

            let msg = `مرحباً Esca Store، هذا طلبي من السلة:\n\n` + window.cart.map((item, i) => {
                const cleanBaseUrl = baseUrl.endsWith('/') ? baseUrl.slice(0, -1) : baseUrl;
                const productUrl = `${cleanBaseUrl}/p/${item.shortCode}`;
                let itemTotal = item.price * item.selQty;
                totalCartPrice += itemTotal;
                return `${i+1}- ${item.name} (قسم: ${item.category})\n🔖 كود: ${item.shortCode}\n لون: ${item.selColor} / مقاس: ${item.selSize} / عدد: ${item.selQty}\n السعر: ${itemTotal} ج.م\n🔗 الرابط: ${productUrl}`;
            }).join('\n\n-----------------\n\n');

            msg += `\n\n🛒 إجمالي الحساب الكلي: ${totalCartPrice} ج.م`;

            window.open(`https://wa.me/${window.SELLER_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.updateCartBadge();
        fetchProducts();
    </script>
</body>
</html>
